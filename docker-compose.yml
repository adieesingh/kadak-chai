services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kadak-chai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://kadak:kadakpass@db:5432/kadakchai?schema=public
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-replace-with-a-long-random-string}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: kadak-chai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kadak
      POSTGRES_PASSWORD: kadakpass
      POSTGRES_DB: kadakchai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadak -d kadakchai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
