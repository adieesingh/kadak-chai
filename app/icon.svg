<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#5B2206" />
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="tea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Container badge / squircle -->
  <rect width="64" height="64" rx="15" fill="url(#bg)" />

  <!-- Steam lines -->
  <path d="M23 21 C21 16 26 13 24 8" stroke="#FEF3C7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <path d="M32 19 C30 13 35 11 33 6" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  <path d="M41 21 C39 16 44 13 42 8" stroke="#FEF3C7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Saucer plate -->
  <ellipse cx="32" cy="49" rx="19" ry="3.5" fill="#FEF3C7" opacity="0.95" />
  <ellipse cx="32" cy="49" rx="14" ry="2" fill="#FDE68A" />

  <!-- Cup Handle -->
  <path d="M41 30 C50 30 50 42 40 42" fill="none" stroke="url(#cup)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Cup Body -->
  <path d="M18 26 H46 L43 41 C42 45 38.5 48 34.5 48 H29.5 C25.5 48 22 45 21 41 Z" fill="url(#cup)" />

  <!-- Tea Liquid rim -->
  <ellipse cx="32" cy="26" rx="14" ry="3.8" fill="#78350F" />
  <ellipse cx="32" cy="26.3" rx="12" ry="2.8" fill="url(#tea)" />
  <ellipse cx="32" cy="26" rx="8" ry="1.4" fill="#FDE68A" opacity="0.5" />
</svg>
